arm_action: /arm_group_controller/follow_joint_trajectory
gripper_action: /grip_group_controller/gripper_cmd
joint_states_topic: /joint_states
# Joint space replay limits. Each route leg is one multi-point action goal.
max_velocity_rad_s: 1.80
max_acceleration_rad_s2: 3.00
min_waypoint_duration_s: 0.20
# Runtime speed multiplier (CLI --speed). Effective segment time = base / speed.
speed_multiplier: 2.0
# RDP simplification bound: collapsed path deviates at most this much
# (max joint delta, rad) from the recorded route; endpoint always kept.
rdp_eps_rad: 0.03
waypoint_timeout_s: 12.0
# Cap for a whole batched leg: route motion time + this margin.
route_timeout_s: 180.0
gripper_timeout_s: 8.0
action_server_timeout_s: 5.0
endpoint_tolerance_rad: 0.08
log_path: /tmp/simplify-chess-game-execution.jsonl
